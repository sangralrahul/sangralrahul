# Draws the contribution "snake" animation used at the bottom of the profile README.
# It regenerates every day and writes the SVGs to the `output` branch.
# One-time setup: repo Settings → Actions → General → Workflow permissions → "Read and write permissions".
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FFFFFF&color_dots=#F4F4F5,#D4D4D8,#A1A1AA,#71717A,#3F3F46
            dist/github-snake-dark.svg?color_snake=#FFFFFF&color_dots=#161616,#3F3F46,#71717A,#A1A1AA,#E4E4E7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
