# Draws the contribution "snake" animation used at the bottom of the profile README.
# It regenerates every day and writes the SVGs to the `output` branch.
# One-time setup: repo Settings → Actions → General → Workflow permissions → "Read and write permissions".
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FBBF24&color_dots=#E0F2FE,#7DD3FC,#38BDF8,#0EA5E9,#0369A1
            dist/github-snake-dark.svg?color_snake=#FBBF24&color_dots=#111827,#0C4A6E,#0369A1,#0EA5E9,#38BDF8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
