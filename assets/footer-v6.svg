<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Let's build something for healthcare. hello@rahulsangral.me">
<style>@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}
.dot{animation:float ease-in-out infinite alternate}@keyframes float{from{transform:translateY(0);opacity:.25}to{transform:translateY(-30px);opacity:.95}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.run{stroke-dasharray:160 840;animation:run 10s linear infinite}@keyframes run{to{stroke-dashoffset:-1000}}.aur{animation:aur 12s ease-in-out infinite alternate}@keyframes aur{from{transform:translateX(-300px)}to{transform:translateX(900px)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
<linearGradient id="shimmer" x1="0" x2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="0.3" stop-color="#3B82F6"/><stop offset="0.6" stop-color="#2DD4BF"/><stop offset="0.8" stop-color="#FBBF24"/><stop offset="1" stop-color="#38BDF8"/>
<animate attributeName="x1" values="-1;0" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1" dur="5s" repeatCount="indefinite"/></linearGradient>
<clipPath id="c"><rect width="1200" height="150" rx="24"/></clipPath><filter id="orb" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="60"/></filter></defs>
<g clip-path="url(#c)"><rect width="1200" height="150" fill="url(#bg)"/><circle cx="600" cy="90" r="220" fill="#2DD4BF" opacity="0.08" filter="url(#orb)"/>
<circle class="dot" style="animation-duration:5.0s;animation-delay:-0.0s" cx="90" cy="40" r="1.8" fill="#38BDF8"/><circle class="dot" style="animation-duration:5.7s;animation-delay:-1.3s" cx="215" cy="77" r="1.8" fill="#3B82F6"/><circle class="dot" style="animation-duration:6.4s;animation-delay:-2.6s" cx="340" cy="114" r="1.8" fill="#2DD4BF"/><circle class="dot" style="animation-duration:7.1s;animation-delay:-3.9s" cx="465" cy="71" r="1.8" fill="#FBBF24"/><circle class="dot" style="animation-duration:7.8s;animation-delay:-5.2s" cx="590" cy="108" r="1.8" fill="#38BDF8"/><circle class="dot" style="animation-duration:8.5s;animation-delay:-6.5s" cx="715" cy="65" r="1.8" fill="#3B82F6"/><circle class="dot" style="animation-duration:9.2s;animation-delay:-7.8s" cx="840" cy="102" r="1.8" fill="#2DD4BF"/><circle class="dot" style="animation-duration:9.9s;animation-delay:-9.1s" cx="965" cy="59" r="1.8" fill="#FBBF24"/><circle class="dot" style="animation-duration:10.6s;animation-delay:-10.4s" cx="1090" cy="96" r="1.8" fill="#38BDF8"/></g>
<rect x="0.5" y="0.5" width="1199" height="149" rx="24" fill="none" stroke="url(#neon)" stroke-opacity="0.45"/><rect class="run" x="0.5" y="0.5" width="1199" height="149" rx="24" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.9" pathLength="1000"/>
<text x="600" y="66" text-anchor="middle" font-family="'Space Grotesk','Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" fill="url(#shimmer)">Let's build something for healthcare.</text>
<text x="600" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#94A3B8">hello@rahulsangral.me  ·  rahulsangral.me  ·  usually replies within a day</text>
<path d="M560 120H640" stroke="url(#neon)" stroke-width="2" stroke-linecap="round"/></svg>