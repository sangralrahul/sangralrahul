<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 4" width="90" height="4">
<style>.s{animation:sw 2.4s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-30px)}100%{transform:translateX(90px)}}@media (prefers-reduced-motion:reduce){.s{animation:none}}</style>
<defs><linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient><clipPath id="c"><rect width="90" height="4" rx="2"/></clipPath></defs>
<rect width="90" height="4" rx="2" fill="#38BDF8" fill-opacity="0.15"/><g clip-path="url(#c)"><rect class="s" width="30" height="4" rx="2" fill="url(#n)"/></g></svg>