<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 4" width="600" height="4" preserveAspectRatio="none">
<style>.s{animation:sw 3.2s cubic-bezier(.45,0,.55,1) infinite}@keyframes sw{0%{transform:translateX(-160px)}100%{transform:translateX(600px)}}@media (prefers-reduced-motion:reduce){.s{animation:none}}</style>
<defs><linearGradient id="n" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs>
<rect width="600" height="4" rx="2" fill="#38BDF8" fill-opacity="0.12"/><rect class="s" width="160" height="4" rx="2" fill="url(#n)"/></svg>