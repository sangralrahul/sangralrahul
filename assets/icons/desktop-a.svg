<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Desktop apps">
<style>
.arc{transform-origin:32px 32px;animation:spin 3.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ring{transform-origin:32px 32px;animation:ring 2.6s ease-out infinite}@keyframes ring{0%{transform:scale(.86);opacity:.55}100%{transform:scale(1.12);opacity:0}}
.g{fill:none;stroke:#38BDF8;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.scr{animation:type 2.4s ease-in-out infinite}.b{animation-delay:.4s}@keyframes type{0%{width:0}50%,80%{width:20px}100%{width:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient></defs>
<circle class="ring" cx="32" cy="32" r="28" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
<circle cx="32" cy="32" r="27" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.30"/>
<circle class="arc" cx="32" cy="32" r="30" fill="none" stroke="url(#n)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="34 155"/>
<rect class="g" x="18" y="20" width="28" height="19" rx="3"/><path class="g" d="M27 46h10M32 39v7"/>
<rect class="scr" x="22" y="24" width="0" height="3" rx="1.5" fill="#2DD4BF"/><rect class="scr b" x="22" y="30" width="0" height="3" rx="1.5" fill="#38BDF8"/>
</svg>