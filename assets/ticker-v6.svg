<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Stack: Python, TypeScript, React, Next.js, FastAPI, PostgreSQL, Firestore, Node.js, Tailwind, Claude API, Amazon Bedrock, Vertex AI, Hugging Face, RAG, scikit-learn, Pandas, AWS, Google Cloud, Azure, Vercel, Railway, Cloudflare, Docker, GitHub Actions, Razorpay, Postman, pytest.">
<style>@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}@font-face{font-family:'JetBrains Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.tick{animation:tick 66.8s linear infinite}
@keyframes tick{to{transform:translateX(-3672px)}}
@media (prefers-reduced-motion:reduce){.tick{animation:none}}
.run{stroke-dasharray:160 840;animation:run 10s linear infinite}@keyframes run{to{stroke-dashoffset:-1000}}.aur{animation:aur 12s ease-in-out infinite alternate}@keyframes aur{from{transform:translateX(-300px)}to{transform:translateX(900px)}}</style>
<defs><linearGradient id="ag38BDF8"><stop offset="0" stop-color="#38BDF8" stop-opacity="0"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#111827"/></linearGradient>
