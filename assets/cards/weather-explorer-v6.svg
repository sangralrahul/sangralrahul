.scan{animation:scan 7s linear infinite}
@keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(var(--sh,520px))}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.in{animation:fadeup .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
