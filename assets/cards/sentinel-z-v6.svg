<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 176" width="580" height="176" role="img" aria-label="Sentinel-Z: Privacy-preserving fraud detection for banking security logs. Pseudonymised, explainable, no cloud calls, runs on IBM Z."><style>@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}
.orb{animation:drift 14s ease-in-out infinite alternate}.o1{animation-duration:18s;animation-direction:alternate-reverse}
