  <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#38BDF8"/><stop offset="0.3" stop-color="#3B82F6"/><stop offset="0.6" stop-color="#2DD4BF"/><stop offset="0.8" stop-color="#FBBF24"/><stop offset="1" stop-color="#38BDF8"/>
    <animate attributeName="x1" values="-1;0" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;1" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
