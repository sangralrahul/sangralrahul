  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="1"/></pattern>
  <clipPath id="card"><rect width="1200" height="76" rx="24"/></clipPath>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="orb" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter></defs><g clip-path="url(#card)"><rect class="aur" x="0" y="0" width="420" height="77" fill="#38BDF8" opacity="0.045" filter="url(#orb)" transform="skewX(-18)"/><rect width="1200" height="76" fill="url(#bg)"/><rect width="1200" height="76" fill="url(#g)"/>
<rect class="beam" x="-120" y="73" width="120" height="3" fill="url(#neon)" opacity="0.9"/></g>
