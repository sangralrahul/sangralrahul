<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 76" width="1200" height="76" role="img" aria-label="Certifications. each one links to the issuer"><style>@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:700}@font-face{font-family:'Space Grotesk';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}@font-face{font-family:'JetBrains Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400}
.orb{animation:drift 14s ease-in-out infinite alternate}.o1{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(-40px,-20px)}to{transform:translate(50px,30px)}}
.rain{animation-name:rain;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rain{to{transform:translateY(var(--h,760px))}}
.dot{animation:float ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0);opacity:.25}to{transform:translateY(-34px);opacity:.95}}
.scan{animation:scan 7s linear infinite}
@keyframes scan{from{transform:translateY(-70px)}to{transform:translateY(var(--sh,520px))}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
.in{animation:fadeup .9s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.caret,.pen{display:none}}
.beam{animation:beam 4s ease-in-out infinite}@keyframes beam{0%{transform:translateX(0)}100%{transform:translateX(1100px)}}.run{stroke-dasharray:160 840;animation:run 10s linear infinite}@keyframes run{to{stroke-dashoffset:-1000}}.aur{animation:aur 12s ease-in-out infinite alternate}@keyframes aur{from{transform:translateX(-300px)}to{transform:translateX(900px)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1C"/><stop offset="1" stop-color="#111827"/></linearGradient>
